<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
@font-face{font-family:FB;src:url(Source%20Code/04B_19.TTF) format("truetype");font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden}
.card{position:relative;width:1280px;height:640px;overflow:hidden;
      background:url(Source%20Code/assets/background-day.png) repeat-x;background-size:auto 700px;background-position:0 -40px;
      image-rendering:pixelated}
.pipe{position:absolute;width:118px;height:720px;background:url(Source%20Code/assets/pipe-green.png) no-repeat;
      background-size:100% 100%;image-rendering:pixelated}
.p1t{left:800px;top:-536px;transform:scaleY(-1)}
.p1b{left:800px;top:364px}
.p2t{left:1092px;top:-596px;transform:scaleY(-1)}
.p2b{left:1092px;top:304px}
.ground{position:absolute;left:0;bottom:0;width:1280px;height:96px;
        background:url(Source%20Code/assets/base.png) repeat-x;background-size:auto 96px;image-rendering:pixelated}
.b{position:absolute;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated}
.b1{left:196px;top:272px;width:56px;height:40px;background-image:url(Source%20Code/assets/bluebird-upflap.png);opacity:.20;transform:rotate(18deg)}
.b2{left:300px;top:236px;width:72px;height:51px;background-image:url(Source%20Code/assets/bluebird-downflap.png);opacity:.38;transform:rotate(6deg)}
.b3{left:420px;top:192px;width:90px;height:64px;background-image:url(Source%20Code/favicon.png);opacity:.62;transform:rotate(-8deg)}
.b4{left:552px;top:132px;width:118px;height:83px;background-image:url(Source%20Code/assets/bluebird-upflap.png);transform:rotate(-24deg);
    filter:drop-shadow(0 7px 0 rgba(0,0,0,.18))}
.tag{position:absolute;left:76px;top:60px;font-family:FB,monospace;font-size:18px;color:#fff;
     text-shadow:3px 3px 0 #543847;letter-spacing:.12em}
.plate{position:absolute;left:76px;bottom:128px;padding:30px 40px 32px;
       background:rgba(26,18,26,.82);border:4px solid rgba(255,255,255,.34);border-radius:6px}
.title{font-family:FB,monospace;font-size:62px;color:#fff;text-shadow:5px 5px 0 #543847;letter-spacing:.02em}
.sub{margin-top:20px;font-family:FB,monospace;font-size:21px;color:#ffd75e;letter-spacing:.08em}
.by{margin-top:14px;font-family:FB,monospace;font-size:21px;color:#fff;letter-spacing:.05em}
</style>
<div class="card">
  <div class="pipe p1t"></div><div class="pipe p1b"></div>
  <div class="pipe p2t"></div><div class="pipe p2b"></div>
  <div class="ground"></div>
  <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
  <div class="tag">PERSONAL PROJECT</div>
  <div class="plate">
    <div class="title">FLAPPY BIRD</div>
    <div class="sub">PYTHON &middot; PYGAME &middot; 2021</div>
    <div class="by">AMEY THAKUR &middot; MEGA SATISH</div>
  </div>
</div>
</body>
</html>
